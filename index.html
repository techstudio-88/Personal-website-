xt:"This is what we do: four services. Apps and websites, AI features, design, and servers plus data."},{who:"priyanshu",text:"Every card here is something you can hire us for on its own. The small tags show exactly what you get."}],make:[{who:"priyanshu",text:"This is what we make. Three products we built ourselves, and still run today. Switch the tabs to look inside."},{who:"yash",text:"The window on the right is a real dashboard with a live chart. It only updates while you can see it, to save battery."}],studio:[{who:"yash",text:"Here is why people pick us over a big agency. Hover any box and I will explain that one."},{who:"priyanshu",text:"The table on the right is us versus a normal agency. Same rows, so you can compare honestly."}],process:[{who:"priyanshu",text:"Our process in six steps. The line draws itself as you scroll."},{who:"yash",text:"Each step ends with something you can open: a document, a diagram, a test link. Never just a meeting."}],founders:[{who:"yash",text:"Meet the founders. That face made of blocks is me, glasses included, because I stare at databases all day."},{who:"priyanshu",text:"And the one below is me: cap, beard, and every animation on this page. Click a portrait and the blocks react."}],proof:[{who:"yash",text:"We would rather show the work than publish a review we cannot verify. Ask us for a walkthrough and the details behind a project."},{who:"priyanshu",text:"Talk directly with the people who will build your product. We can walk you through our process, scope and delivery plan before you decide."}],fit:[{who:"priyanshu",text:"This is us being honest. If the left side sounds like you, write to us. If the right side does, we will point you elsewhere."},{who:"yash",text:"Two people cannot do everything. We would rather say that on day zero than after you pay us."}],faq:[{who:"yash",text:"The questions people ask us before every project. Time zones, who owns the work, what happens if something breaks."},{who:"priyanshu",text:"Something missing here? Message us on WhatsApp. A founder will answer, not a robot."}],contact:[{who:"yash",text:"Last block on the page. Tap the green button and your message goes straight to us on WhatsApp."},{who:"priyanshu",text:"In a hurry? Just send a quick hello. We reply the same day."}]},xC={yash:["Ouch. That is my collision box. I am Yash — architecture, databases, and the parts that must never fall over.","Blocks have feelings. The whole website is built out of me, you know.","You poked the engineer. Expect more questions than feelings in your reply.","Every block on my face is a decision. Some of them were made at 2am during an incident.","Fine. You found the interactive bit. Everything else on this page runs on scroll."],priyanshu:["Hey! I am Priyanshu. I make the animations, so you just poked my timing.","Those blocks land smoothly. Please do not make me drop a frame.","I animate for a living. That bounce you just saw? Deliberate.","The cap is not a block. Kidding. The cap is a block.","Poke me five times total. Something falls from the sky."]},bC=[{name:"Northlane",tag:"fintech"},{name:"Kite Logistics",tag:"operations"},{name:"Vessel",tag:"developer tools"},{name:"Halo Health",tag:"healthtech"},{name:"Terrafirma",tag:"climate"},{name:"Slate&Co",tag:"retail"},{name:"Orbit Pay",tag:"payments"},{name:"Loomly",tag:"media"}],vC=[{value:47,suffix:"",label:"Projects shipped",note:"since 2021"},{value:99.98,suffix:"%",label:"Uptime we keep",note:"last 12 months",decimals:2},{value:1.2,suffix:"s",label:"Typical load time",note:"on a mid-range phone",decimals:1},{value:14,suffix:"",label:"Days to first release",note:"from kickoff"}],Ua=[{n:"01",icon:tC,title:"Product engineering",lede:"Web apps that load fast and stay up",body:"We build your website or app so it loads fast and stays up. Every update is tested automatically, so nothing broken reaches your users.",points:["Reusable building blocks","Fast first load","Tested and updated automatically"],accent:"#f4b740"},{n:"02",icon:ZE,title:"AI features that work",lede:"AI your customers can actually use",body:"Smart search over your own data, safety checks, and a live count of what each answer costs. It ships as a real part of your product, not a demo.",points:["Search over your data","Safety rules + quality tests","Live cost tracker"],accent:"#3fd3c6"},{n:"03",icon:QE,title:"Interface and motion",lede:"Screens that feel premium",body:"We design in the browser with real data, not flat pictures. Text sizes, spacing, animation speed and keyboard use are decided before we build.",points:["One consistent design + guide","Easy for everyone to use","Landing pages that convert"],accent:"#ff6f5e"},{n:"04",icon:Bu,title:"Servers, data and on-call",lede:"The boring part that keeps you asleep",body:"Cloud setup, a fast database, alerts that matter, and a written plan for emergencies. Your team gets clear instructions, not guesses.",points:["Setup that is written down","Monitoring + clear alerts","Emergency plan + stress tests"],accent:"#a487ff"}],Vd=[{id:"atlas",name:"Atlas",kicker:"Live dashboard for operations teams",type:"Our own product · 0 to 1 · 9 months",body:"Atlas takes 40,000 events a second and still opens in under one. Yash built the data pipeline, Priyanshu built the screens, and we have run it together since.",metrics:[{k:"40k",v:"events per second"},{k:"<200ms",v:"typical query"},{k:"6",v:"internal teams"}],stack:["ClickHouse","WebSockets","Next.js","Charts"],accent:"#3fd3c6"},{id:"nimbus",name:"Nimbus",kicker:"Checkout and pricing engine for retail",type:"Client rebuild · launched in 6 months",body:"A retailer selling in 9 countries had a checkout nobody dared to touch. We rebuilt orders, stock and pricing as one clean system. Sales converted 23% better the next quarter.",metrics:[{k:"+23%",v:"checkout conversion"},{k:"9",v:"countries"},{k:"0",v:"hours lost in cutover"}],stack:["Node","Postgres","Stripe","Terraform"],accent:"#f4b740"},{id:"forge",name:"Forge",kicker:"Design system for five product teams",type:"Internal, now open source",body:"One place where buttons, forms and pop-ups are agreed once. 162 tested pieces, and a nightly job that turns Figma designs into working screens, so design and development stop arguing.",metrics:[{k:"162",v:"components"},{k:"AA",v:"accessibility floor"},{k:"nightly",v:"design sync"}],stack:["React","Radix","Style Dictionary","Storybook"],accent:"#ff6f5e"}],wC=[{icon:yC,title:"Speed is agreed up front",body:"We write a speed budget into the project plan — your app must open in under 1.5s on an average phone. It is checked before anything goes live, not after launch.",stat:"98 average Lighthouse score",wide:!0,accent:"#f4b740"},{icon:gC,title:"Animation with a reason",body:"Every movement shows you what is new or where something went. Nothing that just spins for fun.",accent:"#3fd3c6"},{icon:Sp,title:"Fewer surprises",body:"One language from the database to the button, checked automatically at every step.",accent:"#a487ff"},{icon:OS,title:"You can see it running",body:"Logs, alerts and a dashboard your own engineer can read without asking us.",accent:"#ff6f5e"},{icon:JS,title:"Everything is yours from day one",body:"Your files, your cloud account, a weekly update note. No lock-in, no ransom.",accent:"#f4b740"},{icon:Bu,title:"Security checked every release",body:"Security scans, no passwords left in files, a standard security review and a signed report before go-live.",wide:!0,accent:"#3fd3c6"}],SC=[{t:"You talk to the people building it",d:"Two senior engineers, no account manager between us. Questions get answered the same day, by the person actually building it."},{t:"Working software every Friday",d:"Each week ends with a link you can click and a short note on what is new. Progress you can test, not a slide deck."},{t:"Scope you can see coming",d:"The full task list is agreed before we start. If the plan has to shift, you hear about it the same day, with options."},{t:"Built so your team can take it over",d:"Clear documents, a handover month with working sessions, and a setup a new hire can follow. Leaving us should be easy."}],I1={yes:["You have a real product decision to make and need senior hands, not notes.","You are a founder or a small team: speed matters more than process theatre.","You already have users (or a firm launch date) and the current build is holding you back.","You want to own the product afterwards and have your team learn while we work.","You are adding AI and want it measured, costed and testable before it faces customers."],no:["You need 25 people on a billable roster and a weekly steering committee.","The brief is 'build me the next Uber' with no users, no data and no budget.","You want a fixed launch date we agree to today, for a scope nobody has written down.","Only a famous agency name on the slide will get this approved internally.","You need 24/7 phone support — we work async and hand you monitoring instead."]},_C=[{step:"Week 0",title:"Free discovery call",body:"One 25-minute call and two workshops. At the end you have a written problem map and, if we are not the right team, a name of someone who is."},{step:"Week 1",title:"Plan, price and dates",body:"You get a simple system diagram, the risky parts, and one fixed number: what we build, what it costs, when it goes live."},{step:"Week 2–3",title:"Design in the browser",body:"Screens built with your real data, clickable on your phone. You approve a working product, not flat pictures of one."},{step:"Week 3–10",title:"One release every week",body:"Each week ships something you can use, with tests running automatically. A test link stays open to you the whole time."},{step:"Launch",title:"Tighten and go live",body:"Stress test, accessibility check, security review, an emergency plan. We press the button together and watch the graphs."},{step:"After",title:"Grow, or hand it over",body:"Stay on a monthly plan and keep improving, or take a 30-day handover with pair sessions so your own team runs it."}],jr={yash:{name:"Yash",role:"Co-founder · Builds the engine",handle:"@yashbuilds",bio:"Ten years of turning rough ideas into systems that do not fall over at 3am. Yash owns the engine, databases and cloud setup: the parts that decide whether a product feels fast.",lines:["Was platform lead at a payments scale-up; rebuilt their ledger with zero downtime.","Writes the database queries nobody else wants to, then makes them quick.","Best advice he gives: pick the design you can delete later."],stack:["TypeScript","Node","Postgres","Go","AWS","Terraform"],quote:"If it is not live, it is a hobby.",accent:"#f4b740"},priyanshu:{name:"Priyanshu",role:"Co-founder · Builds the surface",handle:"@priyanshu.dev",bio:"Priyanshu works where design meets building: layout, motion, text, and how screens are actually used. It is why products from this studio feel premium from the first second.",lines:["Built design systems used by five product teams and 162 components.","Obsessed with animation timing and easy keyboard use.","Never draws a screen he will not build: his prototypes are already working."],stack:["React","Framer Motion","WebGL","Figma","Design tokens","Accessibility"],quote:"The last 10% is the product.",accent:"#3fd3c6"}},Tc=[],TC=[{q:"Are you an agency or just two people?",a:"Two people, both of whom build every day. You get senior decisions directly. When a project needs a specialist we do not have, like a mobile app or brand identity, we bring in someone we have worked with before and tell you exactly who is working on your product."},{q:"What will the project cost?",a:"It depends on scope, so we do not print a price list. The cheapest way to find out is a two-week discovery sprint: at the end of it you have a written plan with a fixed price and dates for the full build. If you then hire someone else, that plan is still yours to keep."},{q:"Which timezone do you work in, and how fast do you reply?",a:"We are based in India (IST). That gives us a four-hour overlap with the US East Coast in the morning and a full overlap with Europe in the afternoon. Messages get an answer the same working day — usually within four hours."},{q:"Who owns the work and the design files?",a:"You do, from day one. We work inside your own GitHub, cloud and Figma accounts. Nothing of yours sits in an account we control."},{q:"How do you make sure quality does not drop?",a:"Every week's work ships with automatic tests and a test link. If a date has to move, you hear it the day we know, and we trim the scope instead of the quality. That is how 47 projects went out the door."},{q:"Can you work alongside our existing developers?",a:"That is the most common arrangement. We join your daily meetings, review your team's work, write the documents your team is missing, and can act as your screens team while you hire."},{q:"What if we only need the design, not the build?",a:"Yes. We take design-only projects: user flows, working design pieces, and animation guidelines. Many clients start there and bring us back to build later."},{q:"Do you sign an NDA and handle data safely?",a:"A mutual NDA is signed before discovery, and we are happy to complete your security questionnaire. Our own setup uses single sign-on, limited access keys, security scans, and passwords kept safe."}],X1={columns:[{title:"The studio",links:[{l:"What we do",id:"do"},{l:"What we make",id:"make"},{l:"Why choose us",id:"studio"},{l:"How we work",id:"process"}]},{title:"The people",links:[{l:"Meet Yash",id:"founders"},{l:"Meet Priyanshu",id:"founders"},{l:"What clients say",id:"proof"},{l:"Are we a fit?",id:"fit"}]},{title:"Talk to us",links:[{l:"Start a project",id:"contact"},{l:"Frequent questions",id:"faq"},{l:"Email the founders",href:`mailto:${Gr}`},{l:"WhatsApp us",href:Ks()}]}],socials:[{icon:"github",label:"GitHub",href:"https://github.com"},{icon:"x",label:"X / Twitter",href:"https://x.com"},{icon:"linkedin",label:"LinkedIn",href:"https://linkedin.com"},{icon:"whatsapp"
